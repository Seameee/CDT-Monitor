name: "CDT Monitor"
description: "阿里云 CDT 流量与 ECS 状态只读小组件（直连模式，无需服务器）"
author: "青柠 (wang4386)"
homepage: "https://github.com/wang4386/CDT-Monitor"
manual: "https://github.com/wang4386/CDT-Monitor/blob/main/egern/README.md"
icon: "chart.bar.fill"

# 同一 Profile 安装多份本模块时，把 MODULE_ID 改成不同的非秘密值；
# 它用于让脚本与 widget 名称保持唯一。
compat_arguments:
  MODULE_ID: "main"
compat_arguments_desc: "同一 Profile 安装多份时设置不同的非秘密 MODULE_ID；仅字母、数字、下划线和连字符"

env_schema:
  CDT_ACCESS_KEY_ID:
    name: "AccessKey ID"
    description: "本地填写。建议使用只读 RAM 用户，仅授予 CDT 查询与（可选的）ECS 查询权限。分享配置前请移除。"
  CDT_ACCESS_KEY_SECRET:
    name: "AccessKey Secret"
    description: "只保存在你的 Egern 配置中，不要写进任何公开文件或截图。"
  CDT_SECURITY_TOKEN:
    name: "STS SecurityToken（可选）"
    description: "仅在使用临时凭据时需要填写；过期后需重新配置。"
  CDT_SITE_TYPE:
    name: "账户站点"
    description: "选择 BSS 端点与币种。它不决定流量按国内还是海外归类。"
    default_value: "china"
    options: ["china", "international"]
  CDT_REGION_ID:
    name: "实例地域"
    description: "用于推导流量分类与 ECS 端点。香港一律按海外流量归类。"
    default_value: "cn-hongkong"
  CDT_INSTANCE_ID:
    name: "实例 ID（可选）"
    description: "填写 i-xxxx 后才会查询并显示该实例状态；留空则只监控账号流量。"
  CDT_NAME:
    name: "显示名称"
    default_value: "CDT"
  CDT_QUOTA:
    name: "本周期流量上限"
    description: "填你自己确认过的额度，例如 200。留空时只显示真实用量，剩余与百分比显示为未配置，绝不会用默认值代替。"
  CDT_QUOTA_UNIT:
    name: "上限单位"
    description: "GB = 10^9 字节，GiB = 2^30 字节。二者相差约 7.4%，请按你自己的计费口径选择。"
    default_value: "GB"
    options: ["GB", "GiB"]
  CDT_TRAFFIC_CLASS:
    name: "流量归类"
    description: "默认按地域自动推导：cn-*（香港除外）为国内，其余为海外。"
    default_value: "auto"
    options: ["auto", "mainland", "overseas"]
  CDT_THRESHOLD_PERCENT:
    name: "告警阈值(%)"
    description: "取值 (0,100]。仅用于显示与通知，直连只读模式不会因此停机。"
    default_value: "95"
  CDT_REFRESH_SECONDS:
    name: "本地缓存秒数"
    description: "小组件读取本地缓存的有效期，也是 refreshAfter 的意图值；不是采集 cron。"
    default_value: "900"
  CDT_BILLING_ENABLED:
    name: "查询余额和账单"
    description: "默认关闭。启用后需要 BSS 只读权限，余额与实例账单各自缓存 6 小时。"
    default_value: "false"
    options: ["true", "false"]
  CDT_LOCAL_NOTIFY:
    name: "定时阈值通知"
    description: "默认关闭。开启后由定时脚本发送本地通知；小组件渲染永远不会发通知。"
    default_value: "false"
    options: ["true", "false"]
  CDT_TIMEZONE:
    name: "业务时区"
    default_value: "Asia/Shanghai"
  CDT_DEBUG:
    name: "详细诊断"
    description: "仅影响脱敏诊断输出，不会记录密钥。"
    default_value: "false"
    options: ["true", "false"]

scriptings:
  - generic:
      name: "cdt-{{{MODULE_ID}}}-widget"
      script_url: "@@RELEASE_BASE@@/cdt-widget.js"
      timeout: 20
      update_interval: 86400
  - generic:
      name: "cdt-{{{MODULE_ID}}}-diagnostics"
      script_url: "@@RELEASE_BASE@@/cdt-diagnostics.js"
      timeout: 20
      update_interval: 86400
  - schedule:
      name: "cdt-{{{MODULE_ID}}}-refresh"
      cron: "*/15 * * * *"
      script_url: "@@RELEASE_BASE@@/cdt-refresh.js"
      timeout: 30
      update_interval: 86400

widgets:
  - name: "CDT Monitor {{{MODULE_ID}}}"
    script_name: "cdt-{{{MODULE_ID}}}-widget"
