name: "CDT Monitor（实例控制，默认关闭）"
description: "可选的一次性实例启停能力。默认全部禁用；在阅读限制并完成真机验证前请勿启用"
author: "青柠 (wang4386)"
homepage: "https://github.com/wang4386/CDT-Monitor"
manual: "https://github.com/wang4386/CDT-Monitor/blob/main/egern/README.md"
icon: "power"

compat_arguments:
  MODULE_ID: "control"
compat_arguments_desc: "同一 Profile 安装多份时设置不同的非秘密 MODULE_ID"

env_schema:
  CDT_ACCESS_KEY_ID:
    name: "AccessKey ID（控制用）"
    description: "与只读监控凭据分开。仅授予指定实例的 StartInstance/StopInstance。"
  CDT_ACCESS_KEY_SECRET:
    name: "AccessKey Secret（控制用）"
    description: "仅保存在你的 Egern 配置中。"
  CDT_REGION_ID:
    name: "实例地域"
    default_value: "cn-hongkong"
  CDT_INSTANCE_ID:
    name: "实例 ID"
    description: "控制必须使用精确的 i-xxxx 实例 ID。"
  CDT_NAME:
    name: "显示名称"
    default_value: "CDT"
  CDT_CONTROL_JSON:
    name: "控制策略（JSON）"
    description: "必须显式包含 enabled、allowedInstanceIds 与目标策略；任何未知字段都会导致控制保持关闭。默认 enabled=false。"
  CDT_CONTROL_INTENT_JSON:
    name: "一次性控制意图（JSON）"
    description: "临时填写本次要执行的唯一意图（含 nonce、issuedAt、expiresAt），执行后请立即清空。长期固定变量不作为授权。"

scriptings:
  # 默认禁用：模块导入后不会自动开始评估或执行任何控制动作。
  - generic:
      name: "cdt-{{{MODULE_ID}}}-manual"
      script_url: "@@RELEASE_BASE@@/cdt-control.js"
      timeout: 20
      update_interval: 86400
      disabled: true
      env:
        CDT_MODE: "direct"
  - schedule:
      name: "cdt-{{{MODULE_ID}}}-automation"
      # 5 分钟一次：用于覆盖 10 分钟的调度补偿窗，与采集用的 15 分钟周期分离。
      cron: "*/5 * * * *"
      script_url: "@@RELEASE_BASE@@/cdt-automation.js"
      timeout: 30
      update_interval: 86400
      disabled: true
      env:
        CDT_MODE: "direct"

# 有意不声明 widgets：
# 控制脚本不得作为任何小组件的关联脚本，否则小组件渲染就可能触达控制路径。
